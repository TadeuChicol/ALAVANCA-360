<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clínica</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;color:#2d2d2d;line-height:1.7;background:#fafafa}
.hero{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;text-align:center;padding:60px 20px}
.hero img{width:170px;height:170px;border-radius:50%;object-fit:cover;border:4px solid #fff;margin-bottom:20px;background:#fff}
.hero h1{font-size:2em;margin-bottom:6px}
.hero p{font-size:1.05em;opacity:.95}
.container{max-width:900px;margin:0 auto;padding:40px 20px}
section{margin-bottom:50px}
h2{color:#0f766e;font-size:1.5em;margin-bottom:14px;border-left:5px solid #14b8a6;padding-left:12px}
.historia p{margin-bottom:14px;text-align:justify}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}
.card{background:#f0fdfa;border:1px solid #ccfbf1;border-radius:12px;padding:20px;text-align:center}
.card h3{color:#0f766e;margin-bottom:8px}
.cta{text-align:center;background:#f0fdfa;padding:50px 20px;border-radius:16px;margin-top:20px}
.btn{display:inline-block;background:#0f766e;color:#fff;padding:15px 35px;border-radius:50px;text-decoration:none;font-size:1.05em;margin:10px 8px;transition:.3s}
.btn:hover{background:#115e59;transform:translateY(-2px)}
.btn-wa{background:#25d366}.btn-wa:hover{background:#1da851}
.contato{text-align:center;font-size:1.05em}
footer{background:#0f766e;color:#fff;text-align:center;padding:20px;font-size:.9em}
em{color:#b91c1c}
</style>
</head>
<body>

<div class="hero">
  <img id="foto" src="" alt="Profissional">
  <h1 id="nome">Clínica</h1>
  <p id="subtitulo"></p>
  <p id="clinica"></p>
</div>

<div class="container">
  <section>
    <h2>Sobre a Profissional</h2>
    <div id="historia" class="historia"></div>
  </section>

  <section>
    <h2>Especialidades</h2>
    <div id="especialidades" class="grid"></div>
  </section>

  <section class="cta">
    <h2>Agende sua avaliação</h2>
    <p id="cta-texto"></p>
    <a id="btn-agendar" class="btn" href="#" target="_blank">📅 Agendar horário</a>
    <a id="btn-wa" class="btn btn-wa" href="#" target="_blank">💬 Falar no WhatsApp</a>
  </section>

  <section class="contato">
    <h2>Endereço</h2>
    <p id="endereco"></p>
  </section>
</div>

<footer id="footer"></footer>

<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const chave = (params.get('clinica') || 'nap').toLowerCase();
  let dados;
  try {
    const r = await fetch('dados/' + chave + '.json');
    dados = await r.json();
  } catch(e) {
    document.body.innerHTML = '<div style="text-align:center;padding:80px 20px;font-family:sans-serif"><h1>Página não encontrada</h1><p>Verifique o link da clínica.</p></div>';
    return;
  }
  document.title = dados.clinica;
  document.getElementById('nome').textContent = dados.nome_profissional || dados.clinica;
  document.getElementById('subtitulo').textContent = dados.subtitulo || '';
  document.getElementById('clinica').textContent = dados.clinica;
  document.getElementById('foto').src = dados.foto || '';
  const hist = document.getElementById('historia');
  (dados.historia || []).forEach(p => { const el = document.createElement('p'); el.textContent = p; hist.appendChild(el); });
  const sp = document.getElementById('especialidades');
  (dados.especialidades || []).forEach(e => { const c = document.createElement('div'); c.className = 'card'; c.innerHTML = '<h3>' + e.nome + '</h3><p>' + e.desc + '</p>'; sp.appendChild(c); });
  document.getElementById('cta-texto').textContent = 'Tire suas dúvidas e agende com a ' + dados.nome_profissional + '.';
  document.getElementById('btn-agendar').href = dados.cal_link || '#';
  document.getElementById('btn-wa').href = 'https://wa.me/' + (dados.whatsapp || '');
  document.getElementById('endereco').textContent = dados.endereco || '';
  document.getElementById('footer').textContent = '© ' + new Date().getFullYear() + ' ' + dados.clinica + '. Todos os direitos reservados.';
})();
</script>
</body>
</html>
